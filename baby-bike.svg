            <animateTransform attributeName="transform" type="rotate" dur="1.1s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0417;0.0833;0.1250;0.1667;0.2083;0.2500;0.2917;0.3333;0.3750;0.4167;0.4583;0.5000;0.5417;0.5833;0.6250;0.6667;0.7083;0.7500;0.7917;0.8333;0.8750;0.9167;0.9583;1.0000" values="-159.77 0 0; -162.26 0 0; -158.14 0 0; -150.12 0 0; -140.67 0 0; -130.82 0 0; -121.05 0 0; -111.68 0 0; -102.96 0 0; -95.19 0 0; -88.67 0 0; -83.77 0 0; -80.79 0 0; -79.97 0 0; -81.38 0 0; -84.90 0 0; -90.27 0 0; -97.15 0 0; -105.21 0 0; -114.13 0 0; -123.64 0 0; -133.46 0 0; -143.26 0 0; -152.48 0 0; -159.77 0 0"/>
