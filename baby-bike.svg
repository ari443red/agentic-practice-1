      <g transform="rotate(109.05 0 0)">
        <animateTransform attributeName="transform" type="rotate" dur="1.1s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0417;0.0833;0.1250;0.1667;0.2083;0.2500;0.2917;0.3333;0.3750;0.4167;0.4583;0.5000;0.5417;0.5833;0.6250;0.6667;0.7083;0.7500;0.7917;0.8333;0.8750;0.9167;0.9583;1.0000" values="109.05 0 0; 104.04 0 0; 99.90 0 0; 97.18 0 0; 96.24 0 0; 97.12 0 0; 99.67 0 0; 103.59 0 0; 108.56 0 0; 114.22 0 0; 120.21 0 0; 126.10 0 0; 131.39 0 0; 135.50 0 0; 138.01 0 0; 138.87 0 0; 138.38 0 0; 136.89 0 0; 134.63 0 0; 131.71 0 0; 128.20 0 0; 124.09 0 0; 119.43 0 0; 114.33 0 0; 109.05 0 0"/>
        <path d="M0 0 L0 -81" fill="none" stroke="#eab68c" stroke-width="21" stroke-linecap="round"/>
        <g transform="translate(0,-81)">
          <g transform="rotate(-75.83 0 0)">
            <animateTransform attributeName="transform" type="rotate" dur="1.1s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0417;0.0833;0.1250;0.1667;0.2083;0.2500;0.2917;0.3333;0.3750;0.4167;0.4583;0.5000;0.5417;0.5833;0.6250;0.6667;0.7083;0.7500;0.7917;0.8333;0.8750;0.9167;0.9583;1.0000" values="-75.83 0 0; -73.97 0 0; -74.27 0 0; -76.69 0 0; -81.01 0 0; -86.90 0 0; -93.96 0 0; -101.84 0 0; -110.16 0 0; -118.56 0 0; -126.62 0 0; -133.76 0 0; -139.21 0 0; -142.05 0 0; -141.59 0 0; -137.96 0 0; -131.97 0 0; -124.51 0 0; -116.32 0 0; -107.90 0 0; -99.66 0 0; -91.97 0 0; -85.18 0 0; -79.68 0 0; -75.83 0 0"/>
            <path d="M0 0 L0 81" fill="none" stroke="#eab68c" stroke-width="19" stroke-linecap="round"/>
