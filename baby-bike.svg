      <circle cx="550" cy="430" r="72" fill="none" stroke="#33383b" stroke-width="13"/>
      <circle cx="550" cy="430" r="60" fill="none" stroke="#d3d8dc" stroke-width="5"/>
      <g stroke="#a6acb2" stroke-width="2.5">
