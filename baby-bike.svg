        <line x1="250" y1="370" x2="250" y2="490"/>
        <line x1="250" y1="370" x2="250" y2="490" transform="rotate(30 250 430)"/>
        <line x1="250" y1="370" x2="250" y2="490" transform="rotate(60 250 430)"/>
        <line x1="250" y1="370" x2="250" y2="490" transform="rotate(90 250 430)"/>
        <line x1="250" y1="370" x2="250" y2="490" transform="rotate(120 250 430)"/>
        <line x1="250" y1="370" x2="250" y2="490" transform="rotate(150 250 430)"/>
      </g>
