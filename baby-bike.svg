      <path d="M386 296 C 436 272 486 244 528 214" fill="none" stroke="#c3d6ea" stroke-width="3" stroke-linecap="round"/>
      <path d="M396 312 C 448 292 492 268 532 240" fill="none" stroke="#c3d6ea" stroke-width="3" stroke-linecap="round"/>
    </g>

