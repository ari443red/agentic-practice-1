        calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" repeatCount="indefinite"/>
      <path d="M356 292 C 436 258 524 214 616 152 C 570 212 552 240 562 266 C 512 250 460 270 398 308 C 376 320 356 314 356 292 Z"
