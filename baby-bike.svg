    </g>

    <!-- far leg (behind the baby) -->

    <g transform="translate(330,318)">
      <g transform="rotate(135.62 0 0)">
        <animateTransform attributeName="transform" type="rotate" dur="1.1s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0417;0.0833;0.1250;0.1667;0.2083;0.2500;0.2917;0.3333;0.3750;0.4167;0.4583;0.5000;0.5417;0.5833;0.6250;0.6667;0.7083;0.7500;0.7917;0.8333;0.8750;0.9167;0.9583;1.0000" values="135.62 0 0; 139.47 0 0; 140.02 0 0; 138.50 0 0; 136.04 0 0; 133.07 0 0; 129.68 0 0; 125.88 0 0; 121.67 0 0; 117.04 0 0; 112.04 0 0; 106.86 0 0; 101.83 0 0; 97.44 0 0; 94.24 0 0; 92.65 0 0; 92.86 0 0; 94.83 0 0; 98.36 0 0; 103.18 0 0; 109.01 0 0; 115.54 0 0; 122.49 0 0; 129.44 0 0; 135.62 0 0"/>
        <path d="M0 0 L0 -81" fill="none" stroke="#d9a373" stroke-width="21" stroke-linecap="round"/>
        <g transform="translate(0,-81)">
