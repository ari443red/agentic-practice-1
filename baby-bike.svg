                <rect x="-15" y="-4" width="30" height="11" rx="4" fill="#2b2b2b"/>
                <path d="M-18 -6 C 4 -15 22 -10 28 -2 C 26 6 6 9 -12 8 C -22 6 -24 -2 -18 -6 Z" fill="#e0708a" stroke="#d9a373" stroke-width="2.5"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>

    <!-- far arm -->

    <g transform="translate(354,270)">
      <g transform="rotate(0 0 0)">
        <animateTransform attributeName="transform" type="rotate" dur="1.1s" repeatCount="indefinite" calcMode="linear"
          keyTimes="0; 0.25; 0.5; 0.75; 1" values="0 0 0; -2.5 0 0; 0 0 0; 2.5 0 0; 0 0 0"/>
        <path d="M2 2 C 46 4 106 10 140 16" fill="none" stroke="#f0c095" stroke-width="18" stroke-linecap="round"/>
        <circle cx="142" cy="16" r="11" fill="#f0c095"/>
