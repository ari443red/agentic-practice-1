      <path d="M340 300 L506 297"/>
      <path d="M404 428 L512 316"/>
    </g>

    <line x1="512" y1="296" x2="518" y2="318" stroke="#b60f24" stroke-width="14" stroke-linecap="round"/>
    <path d="M515 306 L519 282" fill="none" stroke="#3b3f42" stroke-width="8" stroke-linecap="round"/>
