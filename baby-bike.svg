<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
  <title id="t">A flying baby on a red bike</title>
  <desc id="d">Animated cartoon of a chubby baby in a blue helmet riding a red bicycle with white wings. The wheels spin, the wings flap, the baby pedals with its legs and works the handlebars with its arms while the bike bobs through the clouds.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe6ff"/>
      <stop offset="55%" stop-color="#e6f5ff"/>
      <stop offset="100%" stop-color="#fff3e0"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe6d2"/>
      <stop offset="100%" stop-color="#ffcfa8"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e3eefb"/>
    </linearGradient>

    <g id="cloud" fill="#ffffff">
      <ellipse cx="0" cy="0" rx="48" ry="27"/>
      <circle cx="-36" cy="-8" r="24"/>
      <circle cx="10" cy="-19" r="31"/>
      <circle cx="44" cy="-2" r="22"/>
    </g>

    <style>
      .cloud { animation-name: drift; animation-timing-function: linear; animation-iteration-count: infinite; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(1400px); } }
      .c1 { animation-duration: 24s; animation-delay: -0s; }
      .c2 { animation-duration: 30s; animation-delay: -9s; }
      .c3 { animation-duration: 21s; animation-delay: -17s; }
      .c4 { animation-duration: 36s; animation-delay: -5s; }

      .streak { animation-name: zip; animation-timing-function: linear; animation-iteration-count: infinite; }
      @keyframes zip { from { transform: translateX(0); opacity: 0; } 20% { opacity: 1; } to { transform: translateX(-560px); opacity: 0; } }
      .s1 { animation-duration: 1.6s; animation-delay: -0.2s; }
      .s2 { animation-duration: 1.9s; animation-delay: -0.9s; }
      .s3 { animation-duration: 1.4s; animation-delay: -1.1s; }
      .s4 { animation-duration: 2.2s; animation-delay: -1.6s; }

      .twinkle { animation-name: blink; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
      @keyframes blink { 0%,100% { opacity: 0.15; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.15); } }
      .t1 { animation-duration: 2.1s; animation-delay: 0s; }
      .t2 { animation-duration: 2.6s; animation-delay: -0.8s; }
      .t3 { animation-duration: 1.8s; animation-delay: -1.4s; }
      .t4 { animation-duration: 3s;   animation-delay: -2s; }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <g opacity="0.95">
    <use href="#cloud" class="cloud c1" x="-300" y="120"/>
    <use href="#cloud" class="cloud c2" x="-300" y="330" opacity="0.8"/>
    <use href="#cloud" class="cloud c3" x="-300" y="470" opacity="0.7"/>
    <use href="#cloud" class="cloud c4" x="-300" y="60" opacity="0.85"/>
  </g>

  <g fill="#ffffff">
    <path class="twinkle t1" d="M120 220 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z"/>
    <path class="twinkle t2" d="M690 200 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z"/>
    <path class="twinkle t3" d="M640 430 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z"/>
    <path class="twinkle t4" d="M170 400 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z"/>
  </g>

  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.75">
    <path class="streak s1" d="M780 200 L 900 200"/>
    <path class="streak s2" d="M760 300 L 880 300"/>
    <path class="streak s3" d="M790 380 L 910 380"/>
    <path class="streak s4" d="M770 460 L 890 460"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" dur="3.2s"
      values="0 0; 0 -18; 0 0" keyTimes="0; 0.5; 1" calcMode="spline"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" repeatCount="indefinite"/>

    <!-- wings -->
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="1.6s"
        values="0 330 300; -8 330 300; 0 330 300" keyTimes="0; 0.5; 1"
        calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" repeatCount="indefinite"/>
      <path d="M330 300 C 250 268 170 222 104 166 C 148 224 166 250 156 274 C 202 260 252 280 306 314 C 318 320 328 314 330 300 Z"
            fill="url(#wing)" stroke="#c3d6ea" stroke-width="3"/>
      <path d="M300 292 C 250 268 200 240 160 210" fill="none" stroke="#c3d6ea" stroke-width="3" stroke-linecap="round"/>
      <path d="M292 306 C 240 286 196 262 158 234" fill="none" stroke="#c3d6ea" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g>
